name: Selenium UI tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run UI tests
        run: xvfb-run -a python -m pytest -v --junitxml=test-results.xml

      - name: Save test results and failure attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            allure-results/
            test-results.xml
          retention-days: 7
